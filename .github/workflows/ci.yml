name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    env:
      DOTNET_NOLOGO: "1"
      EIDOS_TEST_BASE_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Eidosc

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld

      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Print toolchain versions
        shell: pwsh
        run: |
          dotnet --info
          clang --version
          if (Get-Command llc -ErrorAction SilentlyContinue) { llc --version }

      - name: Build solution
        run: dotnet build Eidosc/Eidosc.sln /p:UseSharedCompilation=false /nr:false

      - name: Verify product versions
        shell: pwsh
        run: ./Eidosc/scripts/versioning/verify-versions.ps1

      - name: Test release automation
        shell: pwsh
        run: ./Eidosc/scripts/release/Test-ReleaseAutomation.ps1

      - name: Run stable verification suite
        run: >
          dotnet test Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          --no-build
          --filter
          "FullyQualifiedName~Eidosup|FullyQualifiedName~InfoCommandTests|FullyQualifiedName~MirValidatorTests|FullyQualifiedName~MirToLlvmConverterTests|FullyQualifiedName~MirOptimizerTests.CallerOwnedAggregate|FullyQualifiedName~MirOptimizerTests.UniqueRecordUpdate|FullyQualifiedName~MirOptimizerTests.RuntimeArrayRange|FullyQualifiedName~NativeCallerOwnedAggregate_NestedSeqUsesNoHeapAllocation|FullyQualifiedName~RuntimeEffectDispatch_MultiplePayloads_NativeSmoke|FullyQualifiedName~RuntimeEffectDispatch_NinePayloads_NativeSmoke|FullyQualifiedName~RuntimeEffectDispatch_WithThreePayloads_NativeSmoke|FullyQualifiedName~RuntimeContinuationFrameTake_NativeSmoke|FullyQualifiedName~StringLiteralInterning_NativeSmoke"
          /p:UseSharedCompilation=false
          /nr:false

      - name: Gate call folding termination tests
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName call-folding-termination
          -Filter "FullyQualifiedName~ConstantFoldingCallTests"
          -NoBuild
          -NoRestore

      - name: Gate recurrence proof and semantic equivalence tests
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName recurrence-soundness
          -Filter "FullyQualifiedName~LinearRecursionAccumulatorPassTests"
          -NoBuild
          -NoRestore

      - name: Gate MIR inlining correctness tests
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName mir-inlining-soundness
          -Filter "FullyQualifiedName~InliningTests|FullyQualifiedName~MirInliningShapeTests|FullyQualifiedName~MirOptimizerTests.Inlining_"
          -NoBuild
          -NoRestore

      - name: Gate traversable consumer specialization proof
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName traversable-consumer-specialization
          -Filter "FullyQualifiedName~TraversableConsumerSpecializationPassTests|FullyQualifiedName~StdGenericTraversableSequenceFixture_BuildsThroughMir"
          -NoBuild
          -NoRestore

      - name: Gate caller-owned escape proof tests
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName caller-owned-escape-proof
          -Filter "FullyQualifiedName~MirOptimizerTests.CallerOwnedAggregate"
          -NoBuild
          -NoRestore

      - name: Gate LLVM call attribute tests
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName llvm-call-attributes
          -Filter "FullyQualifiedName~LlvmFunctionAttributeInferenceTests|FullyQualifiedName~CallAttributes_"
          -NoBuild
          -NoRestore

      - name: Gate call-layer checksum equivalence
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName call-layer-checksum
          -Filter "FullyQualifiedName~CallLayerChecksum_WithAndWithoutMirOptimization_IsEquivalent"
          -NoBuild
          -NoRestore

      - name: Gate recurrence LLVM IR shape
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName recurrence-ir-shape
          -Filter "FullyQualifiedName~LinearRecursionAccumulatorShapeTests"
          -NoBuild
          -NoRestore

      - name: Gate native allocation counts and inlining ownership
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName native-allocation-counts
          -Filter "FullyQualifiedName~NativeStackPromotion_SmallCopyRecordInBranchAndLoop_PerformsNoHeapAllocations|FullyQualifiedName~NativeCallerOwnedAggregate_NestedSeqUsesNoHeapAllocation|FullyQualifiedName~Inlining_ManagedRecordIdentity_NativeSmoke_PreservesOwnership|FullyQualifiedName~NativeRuntimeArray_ManagedPushSetPopAndExtend_BalanceAllocations"
          -NoBuild
          -NoRestore

      - name: Gate caller-owned stack lifetime with ASan
        if: runner.os == 'Linux'
        shell: pwsh
        run: >
          ./Eidosc/scripts/ci/run-required-test-shard.ps1
          -Project Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          -ShardName caller-owned-asan
          -Filter "FullyQualifiedName~NativeCallerOwnedAggregate_SeqContainedByReturnedRecord_HasNoStackUseAfterReturn"
          -NoBuild
          -NoRestore

      - name: Run LSP performance gate
        run: >
          dotnet test Eidosc/src/Eidosc.Tests/Eidosc.Tests.csproj
          --no-build
          --filter "FullyQualifiedName~LspPerformanceGateTests"
          /p:UseSharedCompilation=false
          /nr:false

      - name: Run performance profile gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./Eidosc/scripts/perf/run-benchmarks.ps1
          -SkipBenchmarks
          -GateThresholds Eidosc/scripts/perf/eidosc-local-thresholds.json
          -ProfileIterations 1
          -ProfileWarmup 0

      - name: Smoke test eidosup help
        run: dotnet run --project Eidosc/src/Eidosup -- --help
